services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    restart: unless-stopped
    env_file:
      - path: ${RUNTIME_ENV_FILE:?RUNTIME_ENV_FILE is required}
        format: raw
    ports:
      - "127.0.0.1:${APP_BIND_PORT:?APP_BIND_PORT is required}:3000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  scheduler:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    restart: unless-stopped
    command:
      - operations-scheduler.mjs
    env_file:
      - path: ${RUNTIME_ENV_FILE:?RUNTIME_ENV_FILE is required}
        format: raw
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - require('node:fs').stat('/tmp/scheduler-health',(e,s)=>{if(e||Date.now()-s.mtimeMs>150000)process.exit(1)})
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
