name: Deploy staging

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-duindorp-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Migrate and deploy staging
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on:
      - self-hosted
      - linux
      - x64
      - duindorp-staging
    timeout-minutes: 30
    env:
      DEPLOY_ENVIRONMENT: staging
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      APP_PORT: ${{ vars.STAGING_APP_PORT }}
      APP_BASE_URL: ${{ vars.STAGING_APP_BASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.STAGING_NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_PROJECT_ID: ${{ vars.STAGING_SUPABASE_PROJECT_ID }}
      MOLLIE_ENABLED: ${{ vars.STAGING_MOLLIE_ENABLED }}
      EMAIL_ENABLED: ${{ vars.STAGING_EMAIL_ENABLED }}
      SENDGRID_FROM_EMAIL: ${{ vars.STAGING_SENDGRID_FROM_EMAIL }}
      SENDGRID_REPLY_TO_EMAIL: ${{ vars.STAGING_SENDGRID_REPLY_TO_EMAIL }}
      SENDGRID_PARENT_OTP_TEMPLATE_ID: ${{ vars.STAGING_SENDGRID_PARENT_OTP_TEMPLATE_ID }}
      SENDGRID_EVENT_WEBHOOK_PUBLIC_KEY: ${{ vars.STAGING_SENDGRID_EVENT_WEBHOOK_PUBLIC_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
      SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
      PARENT_TOKEN_PEPPER: ${{ secrets.STAGING_PARENT_TOKEN_PEPPER }}
      CRON_SECRET: ${{ secrets.STAGING_CRON_SECRET }}
      MOLLIE_API_KEY: ${{ secrets.STAGING_MOLLIE_API_KEY }}
      SENDGRID_API_KEY: ${{ secrets.STAGING_SENDGRID_API_KEY }}
    steps:
      - name: Checkout exact accepted commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          clean: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate, migrate and deploy
        run: bash scripts/deploy/deploy.sh
