name: Staging Mollie acceptance

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exacte 40-teken SHA die al op staging staat
        required: true
        type: string
      staging_run_id:
        description: Succesvolle Deploy staging-run die exact dit artifact heeft geplaatst
        required: true
        type: string
      confirmation:
        description: Typ STAGING-MOLLIE-TESTMODE om de muterende test te starten
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-duindorpteneu-staging
  cancel-in-progress: false

jobs:
  preflight:
    name: Trusted staging release preflight
    uses: ./.github/workflows/_trusted-staging-preflight.yml
    with:
      release_sha: ${{ inputs.release_sha }}
      staging_run_id: ${{ inputs.staging_run_id }}
    permissions:
      actions: read
      contents: read

  acceptance:
    name: Mollie paid, mismatch, replay and refund
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      APP_BASE_URL: https://staging-duindorp.dgwebservices.nl
      EXPECTED_STAGING_SUPABASE_PROJECT_REF: dxbdjtbyghsovlrdcwcr
      RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
      MOLLIE_ACCEPTANCE_CONFIRMATION: ${{ inputs.confirmation }}
      MOLLIE_ACCEPTANCE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout the exact accepted revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Require protected main revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "${RELEASE_SHA}" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "${RELEASE_SHA}" ]]
          [[ "${MOLLIE_ACCEPTANCE_CONFIRMATION}" == "STAGING-MOLLIE-TESTMODE" ]]
          node scripts/deploy/check-http.mjs \
            "${APP_BASE_URL}" staging "${RELEASE_SHA}" \
            "${{ needs.preflight.outputs.artifact_digest }}"

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        with:
          version: 11.5.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install isolated browser client
        run: pnpm exec playwright install --with-deps chromium >/dev/null

      - name: Run paid, mismatch, replay and refund acceptance
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PARENT_TOKEN_PEPPER: ${{ secrets.PARENT_TOKEN_PEPPER }}
          MOLLIE_API_KEY: ${{ secrets.MOLLIE_API_KEY }}
          MOLLIE_PROFILE_ID: ${{ secrets.MOLLIE_PROFILE_ID || vars.MOLLIE_PROFILE_ID }}
          MOLLIE_ACCEPTANCE_SCREENSHOT_PATH: ${{ runner.temp }}/mollie-acceptance-failure.png
        run: node scripts/providers/mollie-staging-acceptance.mjs

      - name: Preserve fictitious checkout failure screenshot
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mollie-acceptance-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/mollie-acceptance-failure.png
          if-no-files-found: ignore
          retention-days: 1

      - name: Enforce idempotent fixture cleanup
        if: always()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/providers/mollie-staging-acceptance.mjs --cleanup-only

      - name: Create exact Mollie acceptance result
        if: success()
        env:
          ARTIFACT_DIGEST: ${{ needs.preflight.outputs.artifact_digest }}
          STAGING_DEPLOY_RUN_ID: ${{ needs.preflight.outputs.staging_run_id }}
          RESULT_PATH: ${{ runner.temp }}/staging-result-mollie.json
        run: |
          set -Eeuo pipefail
          node scripts/deploy/check-http.mjs \
            "${APP_BASE_URL}" staging "${RELEASE_SHA}" "${ARTIFACT_DIGEST}"
          node scripts/deploy/staging-result.mjs create \
            "${RESULT_PATH}" mollie "${RELEASE_SHA}" "${GITHUB_RUN_ID}" \
            "${STAGING_DEPLOY_RUN_ID}" "${ARTIFACT_DIGEST}" -

      - name: Upload exact Mollie acceptance result
        if: success()
        id: result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-result-mollie-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staging-result-mollie.json
          if-no-files-found: error
          retention-days: 30

      - name: Create result-bound Mollie acceptance attestation
        if: success()
        env:
          ARTIFACT_DIGEST: ${{ needs.preflight.outputs.artifact_digest }}
          STAGING_DEPLOY_RUN_ID: ${{ needs.preflight.outputs.staging_run_id }}
          ATTESTATION_PATH: ${{ runner.temp }}/staging-attestation-mollie.json
          RESULT_PATH: ${{ runner.temp }}/staging-result-mollie.json
          RESULT_ARTIFACT_ID: ${{ steps.result.outputs.artifact-id }}
          RESULT_ARTIFACT_DIGEST: ${{ steps.result.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail
          node scripts/deploy/staging-attestation.mjs create \
            "${ATTESTATION_PATH}" "${RESULT_PATH}" mollie "${RELEASE_SHA}" \
            "${GITHUB_RUN_ID}" "${STAGING_DEPLOY_RUN_ID}" \
            "${ARTIFACT_DIGEST}" "${RESULT_ARTIFACT_ID}" \
            "${RESULT_ARTIFACT_DIGEST}"

      - name: Upload exact Mollie acceptance attestation
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-attestation-mollie-${{ github.run_id }}
          path: ${{ runner.temp }}/staging-attestation-mollie.json
          if-no-files-found: error
          retention-days: 30
