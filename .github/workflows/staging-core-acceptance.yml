name: Staging core acceptance

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exacte 40-teken SHA die al naar staging is gedeployed.
        required: true
        type: string
      confirmation:
        description: Typ STAGING-CORE; uitsluitend tijdelijke fictieve medewerkers worden gemaakt.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-core-acceptance
  cancel-in-progress: false

jobs:
  browser-roles:
    name: Staff MFA, role boundaries and mobile navigation
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: staging
    steps:
      - name: Checkout acceptance harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Run self-cleaning staging browser acceptance
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          STAGING_BASE_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: timeout --signal=TERM --kill-after=15s 8m node scripts/staging/core-browser-acceptance.mjs

      - name: Always remove staging acceptance fixtures
        if: always()
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          STAGING_BASE_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CLEANUP_ONLY: "1"
        run: timeout --signal=TERM --kill-after=15s 3m node scripts/staging/core-browser-acceptance.mjs
