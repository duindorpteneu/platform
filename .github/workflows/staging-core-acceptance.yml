name: Staging core acceptance

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exacte 40-teken SHA die al naar staging is gedeployed.
        required: true
        type: string
      staging_run_id:
        description: Succesvolle Deploy staging-run die exact dit artifact heeft geplaatst.
        required: true
        type: string
      confirmation:
        description: Typ STAGING-CORE; uitsluitend tijdelijke fictieve medewerkers worden gemaakt.
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-duindorpteneu-staging
  cancel-in-progress: false

jobs:
  preflight:
    name: Trusted staging release preflight
    uses: ./.github/workflows/_trusted-staging-preflight.yml
    with:
      release_sha: ${{ inputs.release_sha }}
      staging_run_id: ${{ inputs.staging_run_id }}
    permissions:
      actions: read
      contents: read

  browser-roles:
    name: Staff MFA, role boundaries and mobile navigation
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: staging
    steps:
      - name: Checkout acceptance harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Validate exact harness and live release
        env:
          RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
          STAGING_BASE_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          [[ "${CONFIRMATION}" == "STAGING-CORE" ]]
          [[ "$(git rev-parse HEAD)" == "${RELEASE_SHA}" ]]
          node scripts/deploy/check-http.mjs \
            "${STAGING_BASE_URL}" staging "${RELEASE_SHA}" \
            "${{ needs.preflight.outputs.artifact_digest }}"

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        with:
          version: 11.5.2
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec playwright install --with-deps chromium

      - name: Run self-cleaning staging browser acceptance
        env:
          RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
          ARTIFACT_DIGEST: ${{ needs.preflight.outputs.artifact_digest }}
          CONFIRMATION: ${{ inputs.confirmation }}
          STAGING_BASE_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: timeout --signal=TERM --kill-after=15s 8m node scripts/staging/core-browser-acceptance.mjs

      - name: Always remove staging acceptance fixtures
        if: always()
        env:
          RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
          ARTIFACT_DIGEST: ${{ needs.preflight.outputs.artifact_digest }}
          CONFIRMATION: ${{ inputs.confirmation }}
          STAGING_BASE_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CLEANUP_ONLY: "1"
        run: timeout --signal=TERM --kill-after=15s 3m node scripts/staging/core-browser-acceptance.mjs

      - name: Create exact core acceptance result
        if: success()
        env:
          RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
          STAGING_BASE_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          ARTIFACT_DIGEST: ${{ needs.preflight.outputs.artifact_digest }}
          STAGING_DEPLOY_RUN_ID: ${{ needs.preflight.outputs.staging_run_id }}
          RESULT_PATH: ${{ runner.temp }}/staging-result-core.json
        run: |
          set -Eeuo pipefail
          node scripts/deploy/check-http.mjs \
            "${STAGING_BASE_URL}" staging "${RELEASE_SHA}" "${ARTIFACT_DIGEST}"
          node scripts/deploy/staging-result.mjs create \
            "${RESULT_PATH}" core "${RELEASE_SHA}" "${GITHUB_RUN_ID}" \
            "${STAGING_DEPLOY_RUN_ID}" "${ARTIFACT_DIGEST}" -

      - name: Upload exact core acceptance result
        if: success()
        id: result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-result-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staging-result-core.json
          if-no-files-found: error
          retention-days: 30

      - name: Create result-bound core acceptance attestation
        if: success()
        env:
          RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
          ARTIFACT_DIGEST: ${{ needs.preflight.outputs.artifact_digest }}
          STAGING_DEPLOY_RUN_ID: ${{ needs.preflight.outputs.staging_run_id }}
          ATTESTATION_PATH: ${{ runner.temp }}/staging-attestation-core.json
          RESULT_PATH: ${{ runner.temp }}/staging-result-core.json
          RESULT_ARTIFACT_ID: ${{ steps.result.outputs.artifact-id }}
          RESULT_ARTIFACT_DIGEST: ${{ steps.result.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail
          node scripts/deploy/staging-attestation.mjs create \
            "${ATTESTATION_PATH}" "${RESULT_PATH}" core "${RELEASE_SHA}" \
            "${GITHUB_RUN_ID}" "${STAGING_DEPLOY_RUN_ID}" \
            "${ARTIFACT_DIGEST}" "${RESULT_ARTIFACT_ID}" \
            "${RESULT_ARTIFACT_DIGEST}"

      - name: Upload exact core acceptance attestation
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-attestation-core-${{ github.run_id }}
          path: ${{ runner.temp }}/staging-attestation-core.json
          if-no-files-found: error
          retention-days: 30
