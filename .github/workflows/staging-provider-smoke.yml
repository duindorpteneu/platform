name: Staging provider smoke

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Te controleren stagingprovider
        required: true
        type: choice
        options:
          - mollie
          - sendgrid

permissions: {}

concurrency:
  group: staging-provider-smoke-${{ inputs.provider }}
  cancel-in-progress: false

jobs:
  mollie:
    if: inputs.provider == 'mollie'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: staging
    env:
      MOLLIE_API_KEY: ${{ secrets.MOLLIE_API_KEY }}
    steps:
      - name: Validate Mollie test credential without mutation
        shell: bash
        run: |
          set -euo pipefail
          [[ "${MOLLIE_API_KEY}" == test_* ]]
          response="${RUNNER_TEMP}/mollie-profile.json"
          trap 'rm -f "${response}"' EXIT
          status="$(curl --silent --show-error --max-time 20 \
            --output "${response}" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${MOLLIE_API_KEY}" \
            https://api.mollie.com/v2/profiles/me)"
          [[ "${status}" == "200" ]]
          jq -e '.id | strings | startswith("pfl_")' "${response}" >/dev/null
          echo "Mollie testcredential is geldig. Er is niets aangemaakt of gewijzigd."

  sendgrid:
    if: inputs.provider == 'sendgrid'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: staging
    permissions:
      contents: read
    env:
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
      SENDGRID_SMOKE_RECIPIENT: ${{ secrets.SENDGRID_SMOKE_RECIPIENT }}
      SENDGRID_API_BASE_URL: ${{ vars.SENDGRID_API_BASE_URL || 'https://api.sendgrid.com' }}
      SENDGRID_FROM_EMAIL: ${{ vars.SENDGRID_FROM_EMAIL }}
      SENDGRID_REPLY_TO_EMAIL: ${{ vars.SENDGRID_REPLY_TO_EMAIL }}
      SENDGRID_WEBHOOK_ID: ${{ vars.SENDGRID_WEBHOOK_ID }}
      SENDGRID_WEBHOOK_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}/api/webhooks/sendgrid
    steps:
      - name: Checkout provider validation code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure and verify signed staging webhook
        id: webhook
        env:
          SENDGRID_PUBLIC_KEY_FILE: ${{ runner.temp }}/sendgrid-public-key.txt
        run: node scripts/providers/configure-sendgrid-webhook.mjs

      - name: Preserve public verification key for controlled handoff
        uses: actions/upload-artifact@v4
        with:
          name: sendgrid-staging-public-key-${{ github.run_id }}
          path: ${{ runner.temp }}/sendgrid-public-key.txt
          if-no-files-found: error
          retention-days: 1

      - name: Verify Mail Send permission
        shell: bash
        run: |
          set -euo pipefail
          scopes="${RUNNER_TEMP}/sendgrid-scopes.json"
          trap 'rm -f "${scopes}"' EXIT
          status="$(curl --silent --show-error --max-time 20 \
            --output "${scopes}" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${SENDGRID_API_KEY}" \
            "${SENDGRID_API_BASE_URL}/v3/scopes")"
          if [[ "${status}" != "200" ]]; then
            echo "SendGrid scopecontrole gaf HTTP ${status}." >&2
            exit 1
          fi
          if ! jq -e '.scopes | arrays | index("mail.send") != null' "${scopes}" >/dev/null; then
            echo "De staging-API-key mist de vereiste mail.send-scope." >&2
            exit 1
          fi
          echo "De staging-API-key heeft de vereiste mail.send-scope."

      - name: Send one controlled staging message
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SENDGRID_API_KEY}" == SG.* ]]
          [[ "${SENDGRID_API_BASE_URL}" == "https://api.sendgrid.com" || "${SENDGRID_API_BASE_URL}" == "https://api.eu.sendgrid.com" ]]
          [[ "${SENDGRID_FROM_EMAIL}" == *@* && "${SENDGRID_REPLY_TO_EMAIL}" == *@* && "${SENDGRID_SMOKE_RECIPIENT}" == *@* ]]
          payload="${RUNNER_TEMP}/sendgrid-smoke.json"
          headers="${RUNNER_TEMP}/sendgrid-headers.txt"
          trap 'rm -f "${payload}" "${headers}"' EXIT
          node <<'NODE' > "${payload}"
          const { randomUUID } = require("node:crypto");
          const body = {
            personalizations: [{
              to: [{ email: process.env.SENDGRID_SMOKE_RECIPIENT }],
              custom_args: { email_job_id: randomUUID() },
            }],
            from: { email: process.env.SENDGRID_FROM_EMAIL, name: "Duindorp SV Tenueportaal" },
            reply_to: { email: process.env.SENDGRID_REPLY_TO_EMAIL },
            subject: "Stagingcontrole Duindorp SV Tenueportaal",
            content: [
              { type: "text/plain", value: "Dit is een gecontroleerd stagingbericht. Er is geen actie nodig." },
              { type: "text/html", value: "<p>Dit is een gecontroleerd stagingbericht. Er is geen actie nodig.</p>" }
            ],
            tracking_settings: { click_tracking: { enable: false, enable_text: false }, open_tracking: { enable: false } }
          };
          process.stdout.write(JSON.stringify(body));
          NODE
          status="$(curl --silent --show-error --max-time 20 \
            --output /dev/null --dump-header "${headers}" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${SENDGRID_API_KEY}" \
            --header 'Content-Type: application/json' \
            --data-binary "@${payload}" \
            "${SENDGRID_API_BASE_URL}/v3/mail/send")"
          if [[ "${status}" != "202" ]]; then
            echo "SendGrid Mail Send gaf HTTP ${status}; er is geen stagingbericht geaccepteerd." >&2
            exit 1
          fi
          if ! grep -qi '^x-message-id:' "${headers}"; then
            echo "SendGrid gaf HTTP 202 maar geen X-Message-ID; de acceptatie kan niet worden gecorreleerd." >&2
            exit 1
          fi
          echo "SendGrid heeft precies één gecontroleerd stagingbericht geaccepteerd."
