name: Staging backup and isolated restore drill

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Volledige SHA die momenteel op staging staat
        required: true
        type: string
      confirm_target:
        description: Typ exact STAGING-RESTORE
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-restore-drill
  cancel-in-progress: false

jobs:
  restore-drill:
    name: Logical backup and network-isolated restore
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: staging
    env:
      TARGET_ENVIRONMENT: staging
      STAGING_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      CONFIRM_TARGET: ${{ inputs.confirm_target }}
      POSTGRES_IMAGE: public.ecr.aws/supabase/postgres:17.6.1.143@sha256:80d7b27c3e8d77cfa7226eee9508671796da214781ff15a35b3670d7ad5ee453
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Validate staging target, ref, SHA and confirmation
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/staging/validate-target.mjs
          [[ "$(git rev-parse HEAD)" == "${RELEASE_SHA}" ]]
          git merge-base --is-ancestor "${RELEASE_SHA}" origin/main

      - name: Verify exact release is live on public staging
        run: node scripts/deploy/check-http.mjs "${STAGING_APP_URL}" staging "${RELEASE_SHA}"

      - name: Create PostgreSQL 17 backup and run isolated restore
        shell: bash
        run: bash scripts/staging/restore-drill.sh

      - name: Upload redacted restore evidence only
        uses: actions/upload-artifact@v4
        with:
          name: staging-restore-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/duindorp-restore-${{ github.run_id }}-${{ github.run_attempt }}-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Always remove run-specific containers, volumes and sensitive files
        if: always()
        shell: bash
        run: |
          set +e
          run_key="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker rm --force --volumes "duindorp-restore-${run_key}" "duindorp-dump-${run_key}" >/dev/null 2>&1
          rm -f -- \
            "${RUNNER_TEMP}/duindorp-restore-${run_key}.dump" \
            "${RUNNER_TEMP}/duindorp-restore-${run_key}-verification.json" \
            "${RUNNER_TEMP}/duindorp-restore-${run_key}-evidence.json"
