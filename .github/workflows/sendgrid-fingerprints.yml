name: Verify staging SendGrid Mail key

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Typ VERIFY-STAGING-MAIL-SEND om de runtime-key read-only te controleren
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify runtime key has mail.send
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: staging
    env:
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
      SENDGRID_ADMIN_API_KEY: ${{ secrets.SENDGRID_ADMIN_API_KEY }}
      SENDGRID_API_KEY_FINGERPRINT: ${{ vars.SENDGRID_API_KEY_FINGERPRINT }}
      SENDGRID_EXPECTED_ACCOUNT_FINGERPRINT: ${{ vars.SENDGRID_EXPECTED_ACCOUNT_FINGERPRINT }}
      SENDGRID_API_BASE_URL: ${{ vars.SENDGRID_API_BASE_URL || 'https://api.sendgrid.com' }}

    steps:
      - name: Verify binding and mail.send scope read-only
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          umask 077

          [[ "${CONFIRMATION}" == "VERIFY-STAGING-MAIL-SEND" ]]
          [[ "${SENDGRID_API_BASE_URL}" == "https://api.sendgrid.com" ]]
          [[ "${SENDGRID_API_KEY}" =~ ^SG\.([A-Za-z0-9_-]{10,64})\.[A-Za-z0-9_-]{10,128}$ ]]
          [[ "${SENDGRID_ADMIN_API_KEY}" == SG.* ]]
          [[ "${SENDGRID_API_KEY}" != "${SENDGRID_ADMIN_API_KEY}" ]]
          [[ "${SENDGRID_API_KEY_FINGERPRINT}" =~ ^[a-f0-9]{64}$ ]]
          [[ "${SENDGRID_EXPECTED_ACCOUNT_FINGERPRINT}" =~ ^[a-f0-9]{64}$ ]]

          computed_key_fingerprint="$(
            printf '%s' "${SENDGRID_API_KEY}" | sha256sum | awk '{print $1}'
          )"
          [[ "${computed_key_fingerprint}" == "${SENDGRID_API_KEY_FINGERPRINT}" ]]

          account_json="$(
            curl --fail --silent --show-error --max-time 20 \
              --header "Authorization: Bearer ${SENDGRID_ADMIN_API_KEY}" \
              "${SENDGRID_API_BASE_URL}/v3/user/username"
          )"
          account_identity="$(
            jq -er '(.username | strings) + ":" + (.user_id | tostring)' \
              <<<"${account_json}"
          )"
          computed_account_fingerprint="$(
            printf '%s' "${account_identity}" | sha256sum | awk '{print $1}'
          )"
          [[ "${computed_account_fingerprint}" == "${SENDGRID_EXPECTED_ACCOUNT_FINGERPRINT}" ]]

          runtime_scopes="$(
            curl --fail --silent --show-error --max-time 20 \
              --header "Authorization: Bearer ${SENDGRID_API_KEY}" \
              "${SENDGRID_API_BASE_URL}/v3/scopes"
          )"
          jq -e '.scopes | index("mail.send") != null' \
            <<<"${runtime_scopes}" >/dev/null
          echo "De gebonden staging-runtime-key heeft mail.send; er is niets gewijzigd."
