name: Repair PR116 lockfile

on:
  push:
    branches:
      - codex/voeg-tijdelijke-smtp-fallback-voor-emailverzending-toe

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.5.2
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Regenerate lockfile from registry
        run: pnpm install --no-frozen-lockfile --lockfile-only --ignore-scripts

      - name: Verify repaired frozen install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Upload repaired lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repaired-pr116-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
