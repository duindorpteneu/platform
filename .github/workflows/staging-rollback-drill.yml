name: Staging application rollback drill

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exacte releasecandidate die momenteel op staging staat
        required: true
        type: string
      staging_run_id:
        description: Succesvolle Deploy staging-run voor exact dit artifact
        required: true
        type: string
      confirmation:
        description: Typ STAGING-ROLLBACK
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-duindorpteneu-staging
  cancel-in-progress: false

jobs:
  preflight:
    name: Trusted staging release preflight
    uses: ./.github/workflows/_trusted-staging-preflight.yml
    with:
      release_sha: ${{ inputs.release_sha }}
      staging_run_id: ${{ inputs.staging_run_id }}
    permissions:
      actions: read
      contents: read

  rollback:
    name: Artifact-bound application rollback and candidate restore
    needs: preflight
    runs-on:
      - self-hosted
      - linux
      - x64
      - duindorpteneu
      - staging
      - deploy
    timeout-minutes: 25
    environment: staging
    env:
      RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
      ARTIFACT_DIGEST: ${{ needs.preflight.outputs.artifact_digest }}
      STAGING_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Checkout exact releasecandidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Prove isolated staging runner boundary
        run: bash scripts/deploy/assert-runner-boundary.sh staging

      - name: Roll back application and restore exact candidate
        env:
          ROLLBACK_EVIDENCE_PATH: ${{ runner.temp }}/staging-application-rollback.json
        run: bash scripts/staging/application-rollback-drill.sh

      - name: Create exact rollback result
        env:
          RESULT_PATH: ${{ runner.temp }}/staging-result-rollback.json
          ROLLBACK_EVIDENCE_PATH: ${{ runner.temp }}/staging-application-rollback.json
        run: |
          set -Eeuo pipefail
          node scripts/deploy/check-http.mjs \
            "${STAGING_APP_URL}" staging "${RELEASE_SHA}" \
            "${ARTIFACT_DIGEST}"
          node scripts/deploy/staging-result.mjs create \
            "${RESULT_PATH}" rollback "${RELEASE_SHA}" "${GITHUB_RUN_ID}" \
            "${{ needs.preflight.outputs.staging_run_id }}" \
            "${ARTIFACT_DIGEST}" "${ROLLBACK_EVIDENCE_PATH}"

      - name: Upload exact rollback result and evidence
        id: result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-result-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/staging-result-rollback.json
            ${{ runner.temp }}/staging-application-rollback.json
          if-no-files-found: error
          retention-days: 30

      - name: Create result-bound rollback attestation
        env:
          ATTESTATION_PATH: ${{ runner.temp }}/staging-attestation-rollback.json
          RESULT_PATH: ${{ runner.temp }}/staging-result-rollback.json
          RESULT_ARTIFACT_ID: ${{ steps.result.outputs.artifact-id }}
          RESULT_ARTIFACT_DIGEST: ${{ steps.result.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail
          node scripts/deploy/staging-attestation.mjs create \
            "${ATTESTATION_PATH}" "${RESULT_PATH}" rollback "${RELEASE_SHA}" \
            "${GITHUB_RUN_ID}" \
            "${{ needs.preflight.outputs.staging_run_id }}" \
            "${ARTIFACT_DIGEST}" "${RESULT_ARTIFACT_ID}" \
            "${RESULT_ARTIFACT_DIGEST}"

      - name: Upload exact rollback attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-attestation-rollback-${{ github.run_id }}
          path: ${{ runner.temp }}/staging-attestation-rollback.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove runner evidence
        if: always()
        run: >-
          rm -f --
          "${RUNNER_TEMP}/staging-attestation-rollback.json"
          "${RUNNER_TEMP}/staging-result-rollback.json"
          "${RUNNER_TEMP}/staging-application-rollback.json"
