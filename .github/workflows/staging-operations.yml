name: Staging operations

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exacte 40-teken SHA die momenteel op staging staat
        required: true
        type: string
      staging_run_id:
        description: Succesvolle Deploy staging-run die exact dit artifact heeft geplaatst
        required: true
        type: string
      job:
        description: Stagingtaak
        required: true
        default: all
        type: choice
        options:
          - all
          - email
          - retention
          - health

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-duindorpteneu-staging
  cancel-in-progress: false

jobs:
  preflight:
    name: Trusted staging release preflight
    uses: ./.github/workflows/_trusted-staging-preflight.yml
    with:
      release_sha: ${{ inputs.release_sha }}
      staging_run_id: ${{ inputs.staging_run_id }}
    permissions:
      actions: read
      contents: read

  operations:
    name: Exact-release scheduler and health acceptance
    needs: preflight
    runs-on:
      - self-hosted
      - linux
      - x64
      - duindorpteneu
      - staging
      - deploy
    timeout-minutes: 15
    environment: staging
    env:
      APP_BASE_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
    steps:
      - name: Checkout exact live release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Verify trusted checkout and live SHA
        run: |
          set -Eeuo pipefail
          bash scripts/deploy/assert-runner-boundary.sh staging
          [[ "$(git rev-parse HEAD)" == "${RELEASE_SHA}" ]]
          node scripts/deploy/check-http.mjs \
            "${APP_BASE_URL}" staging "${RELEASE_SHA}" \
            "${{ needs.preflight.outputs.artifact_digest }}"

      - name: Invoke selected internal operations in order
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REQUESTED_JOB: ${{ inputs.job }}
        run: |
          set -Eeuo pipefail
          invoke() {
            local method="$1"
            local path="$2"
            local contract="$3"
            local response="${RUNNER_TEMP}/operation-response.json"
            curl --fail --silent --show-error --max-time 50 \
              --request "${method}" \
              --header "Authorization: Bearer ${CRON_SECRET}" \
              --output "${response}" \
              "${APP_BASE_URL}${path}"
            case "${contract}" in
              email)
                jq -e '
                  .status == "processed"
                  and (.claimed | type == "number")
                  and (.sent | type == "number")
                  and (.completionErrors == 0)
                ' "${response}" >/dev/null
                ;;
              retention)
                jq -e '
                  .status == "completed"
                  and (.deleted | type == "object")
                ' "${response}" >/dev/null
                ;;
              health)
                jq -e '
                  .status == "healthy"
                  and .emailControl.gateMatches == true
                  and .emailControl.providerConfigured == true
                  and .emailControl.keyFingerprintMatches == true
                ' "${response}" >/dev/null
                ;;
            esac
            rm -f "${response}"
          }
          if [[ "${REQUESTED_JOB}" == all || "${REQUESTED_JOB}" == email ]]; then
            invoke POST /api/internal/jobs/email email
          fi
          if [[ "${REQUESTED_JOB}" == all || "${REQUESTED_JOB}" == retention ]]; then
            invoke POST /api/internal/jobs/retention retention
          fi
          if [[ "${REQUESTED_JOB}" == all || "${REQUESTED_JOB}" == health ]]; then
            invoke GET /api/internal/health health
          fi

      - name: Prove two autonomous scheduler cycles on the exact container
        if: inputs.job == 'all'
        run: |
          set -Eeuo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mapfile -t scheduler_containers < <(
            docker ps \
              --filter label=com.docker.compose.project=duindorpteneu-staging \
              --filter label=com.docker.compose.service=scheduler \
              --format '{{.ID}}'
          )
          [[ "${#scheduler_containers[@]}" == 1 ]]
          scheduler="${scheduler_containers[0]}"
          [[ "$(
            docker inspect --format \
              '{{index .Config.Labels "nl.dgwebservices.duindorpteneu.sha"}}' \
              "${scheduler}"
          )" == "${RELEASE_SHA}" ]]
          [[ "$(
            docker inspect --format \
              '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' \
              "${scheduler}"
          )" == healthy ]]
          marker_epoch() {
            docker exec "${scheduler}" \
              node -e 'require("node:fs").stat("/tmp/scheduler-health",(error,value)=>{if(error)process.exit(1);process.stdout.write(String(Math.floor(value.mtimeMs)))})'
          }
          previous="$(marker_epoch)"
          for _ in 1 2; do
            advanced=false
            for _ in $(seq 1 100); do
              current="$(marker_epoch)"
              if [[ "${current}" -gt "${previous}" ]]; then
                advanced=true
                previous="${current}"
                break
              fi
              sleep 2
            done
            [[ "${advanced}" == true ]]
          done
          recent_logs="${RUNNER_TEMP}/scheduler-two-cycle.log"
          docker logs --since "${started_at}" "${scheduler}" 2>&1 \
            | node scripts/deploy/redact-logs.mjs \
            > "${recent_logs}"
          if rg -q '"event":"scheduler_cycle_failed"|"event":"scheduler_fatal"' \
            "${recent_logs}"; then
            exit 1
          fi
          rm -f -- "${recent_logs}"

      - name: Create exact operations result
        if: inputs.job == 'all'
        env:
          ARTIFACT_DIGEST: ${{ needs.preflight.outputs.artifact_digest }}
          STAGING_DEPLOY_RUN_ID: ${{ needs.preflight.outputs.staging_run_id }}
          RESULT_PATH: ${{ runner.temp }}/staging-result-operations.json
          REQUESTED_JOB: ${{ inputs.job }}
        run: |
          set -Eeuo pipefail
          [[ "${REQUESTED_JOB}" == "all" ]]
          node scripts/deploy/check-http.mjs \
            "${APP_BASE_URL}" staging "${RELEASE_SHA}" "${ARTIFACT_DIGEST}"
          node scripts/deploy/staging-result.mjs create \
            "${RESULT_PATH}" operations "${RELEASE_SHA}" "${GITHUB_RUN_ID}" \
            "${STAGING_DEPLOY_RUN_ID}" "${ARTIFACT_DIGEST}" -

      - name: Upload exact operations result
        if: inputs.job == 'all'
        id: result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-result-operations-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staging-result-operations.json
          if-no-files-found: error
          retention-days: 30

      - name: Create result-bound operations attestation
        if: inputs.job == 'all'
        env:
          ARTIFACT_DIGEST: ${{ needs.preflight.outputs.artifact_digest }}
          STAGING_DEPLOY_RUN_ID: ${{ needs.preflight.outputs.staging_run_id }}
          ATTESTATION_PATH: ${{ runner.temp }}/staging-attestation-operations.json
          RESULT_PATH: ${{ runner.temp }}/staging-result-operations.json
          RESULT_ARTIFACT_ID: ${{ steps.result.outputs.artifact-id }}
          RESULT_ARTIFACT_DIGEST: ${{ steps.result.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail
          node scripts/deploy/staging-attestation.mjs create \
            "${ATTESTATION_PATH}" "${RESULT_PATH}" operations \
            "${RELEASE_SHA}" "${GITHUB_RUN_ID}" \
            "${STAGING_DEPLOY_RUN_ID}" "${ARTIFACT_DIGEST}" \
            "${RESULT_ARTIFACT_ID}" "${RESULT_ARTIFACT_DIGEST}"

      - name: Upload exact operations attestation
        if: inputs.job == 'all'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-attestation-operations-${{ github.run_id }}
          path: ${{ runner.temp }}/staging-attestation-operations.json
          if-no-files-found: error
          retention-days: 30
