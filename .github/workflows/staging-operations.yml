name: Staging operations

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: Stagingtaak
        required: true
        default: all
        type: choice
        options:
          - all
          - email
          - retention
          - health

permissions: {}

concurrency:
  group: staging-operations
  cancel-in-progress: false

jobs:
  email-queue:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *') ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'email'))
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: staging
    env:
      APP_BASE_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Drain staging email queue once per minute
        shell: bash
        run: |
          set -euo pipefail
          iterations=5
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then iterations=1; fi
          for ((attempt=1; attempt<=iterations; attempt++)); do
            curl --fail --silent --show-error --max-time 50 \
              --request POST \
              --header "Authorization: Bearer ${CRON_SECRET}" \
              "${APP_BASE_URL}/api/internal/jobs/email"
            if (( attempt < iterations )); then sleep 60; fi
          done

  retention:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '17 3 * * *') ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'retention'))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: staging
    env:
      APP_BASE_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Run staging retention
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 50 \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_BASE_URL}/api/internal/jobs/retention"

  health:
    if: github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'health')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: staging
    env:
      APP_BASE_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check private staging health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_BASE_URL}/api/internal/health"
