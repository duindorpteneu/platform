name: Staging domain cleanup

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exacte 40-teken SHA die momenteel op staging staat
        required: true
        type: string
      mode:
        description: Dry-run wijzigt niets; apply vereist encrypted backup en wist alleen de vaste allowlist
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      confirmation:
        description: Typ STAGING-CLEANUP-DRY-RUN of STAGING-CLEANUP-APPLY overeenkomstig de modus
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-duindorpteneu-staging
  cancel-in-progress: false

env:
  TARGET_ENVIRONMENT: staging
  TARGET_OPERATION: cleanup
  CLEANUP_MODE: ${{ inputs.mode }}
  STAGING_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
  SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
  RELEASE_SHA: ${{ inputs.release_sha }}
  CONFIRM_TARGET: ${{ inputs.confirmation }}
  POSTGRES_IMAGE: public.ecr.aws/supabase/postgres:17.6.1.143@sha256:80d7b27c3e8d77cfa7226eee9508671796da214781ff15a35b3670d7ad5ee453

jobs:
  dry-run:
    if: inputs.mode == 'dry-run'
    name: Read-only staging cleanup preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Checkout exact live release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Validate exact staging target, main ancestry and live release
        run: |
          set -Eeuo pipefail
          node scripts/staging/validate-target.mjs
          git merge-base --is-ancestor "${RELEASE_SHA}" origin/main
          node scripts/deploy/check-http.mjs "${STAGING_APP_URL}" staging "${RELEASE_SHA}"

      - name: Produce read-only aggregate cleanup evidence
        env:
          CLEANUP_EVIDENCE_PATH: ${{ runner.temp }}/staging-domain-cleanup-dry-run.json
        run: bash scripts/staging/cleanup-operational-data.sh

      - name: Upload redacted dry-run evidence
        uses: actions/upload-artifact@v4
        with:
          name: staging-domain-cleanup-dry-run-${{ inputs.release_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/staging-domain-cleanup-dry-run.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary evidence
        if: always()
        run: rm -f -- "${RUNNER_TEMP}/staging-domain-cleanup-dry-run.json"

  apply:
    if: inputs.mode == 'apply'
    name: Backup, restore-verify and atomically clean staging
    runs-on:
      - self-hosted
      - linux
      - x64
      - duindorpteneu
      - staging
    timeout-minutes: 90
    environment: staging
    env:
      STAGING_CLEANUP_BACKUP_PASSPHRASE: ${{ secrets.STAGING_CLEANUP_BACKUP_PASSPHRASE }}
      MOLLIE_ENABLED: ${{ vars.MOLLIE_ENABLED || 'false' }}
      EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED || 'false' }}
      DYNAMIC_IMPORT_ENABLED: ${{ vars.DYNAMIC_IMPORT_ENABLED || 'false' }}
    steps:
      - name: Checkout exact live release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Validate exact staging target, main ancestry and live release
        run: |
          set -Eeuo pipefail
          node scripts/staging/validate-target.mjs
          git merge-base --is-ancestor "${RELEASE_SHA}" origin/main
          node scripts/deploy/check-http.mjs "${STAGING_APP_URL}" staging "${RELEASE_SHA}"

      - name: Create cleanup run identity
        id: cleanup
        run: |
          set -Eeuo pipefail
          cleanup_run_id="$(node -e 'process.stdout.write(require("node:crypto").randomUUID())')"
          printf 'run_id=%s\n' "${cleanup_run_id}" >> "${GITHUB_OUTPUT}"
          printf 'artifact_name=staging-domain-backup-%s\n' "${cleanup_run_id}" >> "${GITHUB_OUTPUT}"

      - name: Pause only staging, prove encrypted restore and clean the fixed allowlist
        env:
          CLEANUP_RUN_ID: ${{ steps.cleanup.outputs.run_id }}
          BACKUP_ARTIFACT_NAME: ${{ steps.cleanup.outputs.artifact_name }}
          BACKUP_ARTIFACT_PATH: ${{ runner.temp }}/${{ steps.cleanup.outputs.artifact_name }}.dump.gpg
          CLEANUP_EVIDENCE_PATH: ${{ runner.temp }}/staging-domain-cleanup-apply.json
        run: bash scripts/staging/cleanup-operational-data.sh

      - name: Upload encrypted recoverable pre-wipe backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.cleanup.outputs.artifact_name }}
          path: ${{ runner.temp }}/${{ steps.cleanup.outputs.artifact_name }}.dump.gpg
          if-no-files-found: warn
          retention-days: 30

      - name: Upload redacted cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-domain-cleanup-evidence-${{ inputs.release_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/staging-domain-cleanup-apply.json
          if-no-files-found: warn
          retention-days: 30

      - name: Always remove encrypted and redacted runner files
        if: always()
        run: |
          set +e
          rm -f -- \
            "${RUNNER_TEMP}/${{ steps.cleanup.outputs.artifact_name }}.dump.gpg" \
            "${RUNNER_TEMP}/staging-domain-cleanup-apply.json"
