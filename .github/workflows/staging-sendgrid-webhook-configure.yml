name: Configure staging SendGrid webhook

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exacte 40-teken SHA die momenteel op staging staat
        required: true
        type: string
      staging_run_id:
        description: Succesvolle Deploy staging-run voor exact dit artifact
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-duindorpteneu-staging
  cancel-in-progress: false

jobs:
  preflight:
    name: Trusted staging release preflight
    uses: ./.github/workflows/_trusted-staging-preflight.yml
    with:
      release_sha: ${{ inputs.release_sha }}
      staging_run_id: ${{ inputs.staging_run_id }}
    permissions:
      actions: read
      contents: read

  configure:
    name: Configure signed webhook
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - name: Checkout exact live release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Verify exact live staging artifact
        env:
          RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
          STAGING_BASE_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          ARTIFACT_DIGEST: ${{ needs.preflight.outputs.artifact_digest }}
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "${RELEASE_SHA}" ]]
          node scripts/deploy/check-http.mjs \
            "${STAGING_BASE_URL}" staging "${RELEASE_SHA}" \
            "${ARTIFACT_DIGEST}"

      - name: Configure exact event selection and signing
        env:
          SENDGRID_ADMIN_API_KEY: ${{ secrets.SENDGRID_ADMIN_API_KEY }}
          SENDGRID_API_BASE_URL: ${{ vars.SENDGRID_API_BASE_URL || 'https://api.sendgrid.com' }}
          SENDGRID_EXPECTED_ACCOUNT_FINGERPRINT: ${{ vars.SENDGRID_EXPECTED_ACCOUNT_FINGERPRINT }}
          SENDGRID_WEBHOOK_ID: ${{ vars.SENDGRID_WEBHOOK_ID }}
          SENDGRID_WEBHOOK_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}/api/webhooks/sendgrid
          SENDGRID_PUBLIC_KEY_FILE: ${{ runner.temp }}/sendgrid-public-key.txt
        run: node scripts/providers/configure-sendgrid-webhook.mjs

      - name: Upload public key for explicit environment handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sendgrid-staging-public-key-${{ github.run_id }}
          path: ${{ runner.temp }}/sendgrid-public-key.txt
          if-no-files-found: error
          retention-days: 7
