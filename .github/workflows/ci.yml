name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  application:
    name: Application quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        with:
          version: 11.5.2
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Lint GitHub Actions workflows
        run: pnpm lint:workflows

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Reject known high or critical dependencies
        run: pnpm security:dependencies

      - name: Scan repository for secrets
        run: node scripts/check-secrets.mjs

      - name: Lint forward-only migrations
        run: node scripts/check-migrations.mjs

      - name: Lint application
        run: pnpm lint

      - name: Type-check application
        run: pnpm typecheck

      - name: Run unit and integration tests
        run: pnpm test

      - name: Prove application log privacy
        run: pnpm test:log-privacy

      - name: Build production application
        run: pnpm build

  database:
    name: Supabase migration and pgTAP gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        with:
          version: 11.5.2
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install checksum-verified Supabase CLI
        run: bash scripts/deploy/install-supabase-cli.sh

      - name: Start isolated local Supabase
        run: pnpm supabase:start

      - name: Export local Supabase browser build configuration
        run: node scripts/export-local-supabase-ci-env.mjs

      - name: Run legacy Phase B upgrade reconciliation
        run: pnpm test:db:upgrade:phase-b

      - name: Apply all migrations to a clean database
        run: pnpm db:reset

      - name: Run database and RLS tests
        run: pnpm test:db

      - name: Run isolated Mollie fixture SQL integration
        run: pnpm test:db:mollie-fixture

      - name: Run fulfilment concurrency test
        run: pnpm test:db:concurrency

      - name: Run parent-access concurrency test
        run: pnpm test:db:access-concurrency

      - name: Run variant alias concurrency test
        run: pnpm test:db:variant-concurrency

      - name: Run action-item concurrency test
        run: pnpm test:db:action-concurrency

      - name: Run dynamic-import concurrency test
        run: pnpm test:db:import-concurrency

      - name: Run package concurrency test
        run: pnpm test:db:package-concurrency

      - name: Run payment concurrency test
        run: pnpm test:db:payment-concurrency

      - name: Run manual refund concurrency test
        run: pnpm test:db:refund-concurrency

      - name: Run inventory concurrency test
        run: pnpm test:db:inventory-concurrency

      - name: Run delivery notification concurrency test
        run: pnpm test:db:delivery-notification-concurrency

      - name: Run mail projection concurrency test
        run: |
          pnpm test:db:mail-projection-concurrency
          pnpm test:db:mail-supersession-concurrency
          pnpm test:db:mail-test-delivery-concurrency
          pnpm test:db:branding-concurrency

      - name: Run mail campaign concurrency test
        run: pnpm test:db:mail-campaign-concurrency
      - name: Run e-mail delivery-attempt concurrency test
        run: pnpm test:db:email-attempt-concurrency

      - name: Run parent OTP concurrency test
        run: pnpm test:db:parent-otp-concurrency

      - name: Run supplier planning concurrency test
        run: pnpm test:db:supplier-concurrency

      - name: Run staging cleanup transaction contract
        run: pnpm test:db:staging-cleanup

      - name: Build browser-test application
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Prove canon capacity and critical p95 latency
        env:
          CAPACITY_TEST_DISPOSABLE_DB: "1"
        run: pnpm test:capacity

      - name: Run staff MFA integration
        run: pnpm test:staff-mfa

      - name: Run parent portal access browser acceptance
        run: timeout --signal=TERM --kill-after=10s 4m pnpm test:portal-access-browser

      - name: Run full Playwright browser review
        run: pnpm test:a11y

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase:stop
