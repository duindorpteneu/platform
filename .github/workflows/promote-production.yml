name: Promote production

on:
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: Succesvolle Deploy staging-run met het te promoveren immutable artefact.
        required: true
        type: string
      release_sha:
        description: Exacte volledige main-SHA die op staging is geverifieerd.
        required: true
        type: string
      confirmation:
        description: Typ PROMOTE-PRODUCTION om de beschermde productionapproval te openen.
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-duindorpteneu-production
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate staged immutable release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
      staging_run_id: ${{ steps.release.outputs.staging_run_id }}
    steps:
      - name: Checkout main history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Verify explicit promotion target
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.release_sha }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          [[ "$CONFIRMATION" == "PROMOTE-PRODUCTION" ]]
          [[ "$REQUESTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$STAGING_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${STAGING_RUN_ID}")"
          [[ "$(jq -r .conclusion <<<"$run_json")" == "success" ]]
          [[ "$(jq -r .head_sha <<<"$run_json")" == "$REQUESTED_SHA" ]]
          [[ "$(jq -r .path <<<"$run_json")" == ".github/workflows/deploy.yml" ]]
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$REQUESTED_SHA" origin/main
          printf 'release_sha=%s\n' "$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
          printf 'staging_run_id=%s\n' "$STAGING_RUN_ID" >> "$GITHUB_OUTPUT"

  deploy-production:
    name: Approve, deploy and verify production
    needs: validate-release
    runs-on:
      - self-hosted
      - linux
      - x64
      - duindorpteneu
      - production
    timeout-minutes: 45
    environment:
      name: production
      url: https://duindorp.dgwebservices.nl
    steps:
      - name: Checkout exact staged release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release.outputs.release_sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked deployment dependencies
        run: pnpm install --frozen-lockfile

      - name: Download exact staged image
        uses: actions/download-artifact@v4
        with:
          name: release-image-${{ needs.validate-release.outputs.release_sha }}
          path: .release
          github-token: ${{ github.token }}
          run-id: ${{ needs.validate-release.outputs.staging_run_id }}

      - name: Download staging release manifest
        uses: actions/download-artifact@v4
        with:
          name: staging-release-${{ needs.validate-release.outputs.release_sha }}
          path: .staging-release
          github-token: ${{ github.token }}
          run-id: ${{ needs.validate-release.outputs.staging_run_id }}

      - name: Verify staged artefact and deploy production
        env:
          RELEASE_SHA: ${{ needs.validate-release.outputs.release_sha }}
          DEPLOYMENT_MODE: current
          APP_HOST: ${{ vars.APP_HOST }}
          APP_BIND_PORT: ${{ vars.APP_BIND_PORT }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          MOLLIE_ENABLED: ${{ vars.MOLLIE_ENABLED || 'false' }}
          EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED || 'false' }}
          SENDGRID_API_BASE_URL: ${{ vars.SENDGRID_API_BASE_URL || 'https://api.sendgrid.com' }}
          SENDGRID_FROM_EMAIL: ${{ vars.SENDGRID_FROM_EMAIL }}
          SENDGRID_REPLY_TO_EMAIL: ${{ vars.SENDGRID_REPLY_TO_EMAIL }}
          SENDGRID_EVENT_WEBHOOK_PUBLIC_KEY: ${{ vars.SENDGRID_EVENT_WEBHOOK_PUBLIC_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          PARENT_TOKEN_PEPPER: ${{ secrets.PARENT_TOKEN_PEPPER }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          OPERATIONS_HEARTBEAT_URL: ${{ secrets.OPERATIONS_HEARTBEAT_URL }}
          MOLLIE_API_KEY: ${{ secrets.MOLLIE_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          RELEASE_ARTIFACT: ${{ github.workspace }}/.release/duindorpteneu-app.tar.gz
          RELEASE_MANIFEST_SOURCE: ${{ github.workspace }}/.release/RELEASE_MANIFEST
          STAGING_RELEASE_MANIFEST: ${{ github.workspace }}/.staging-release/RELEASE_MANIFEST
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/deploy-vps.sh production
